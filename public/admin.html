<!doctype html><html lang="zh-Hant-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · 排隊系統管理端</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/lang.css">
</head><body class="auth-locked">
<div class="topbar">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 6v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-6z"/><path d="M13 5v2M13 11v2M13 17v2"/></svg><span data-i18n="app.admin"></span></div>
  <div class="right"><span class="chip" id="sessChip">—</span><span class="chip" id="dataChip">—</span></div>
</div>

<div class="shell">
  <aside class="rail" id="rail">
    <div class="grp" data-i18n="g.console"></div>
    <button data-page="overview" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="lbl" data-i18n="a.overview"></span></button>
    <button data-page="session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="lbl" data-i18n="a.session"></span></button>
    <button data-page="announce"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg><span class="lbl" data-i18n="a.announce"></span></button>
    <button data-page="counters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg><span class="lbl" data-i18n="a.counters"></span></button>
    <button data-page="texts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg><span class="lbl" data-i18n="a.texts"></span></button>
    <button data-page="ticket"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 6v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-6z"/><path d="M13 5v2M13 11v2M13 17v2"/></svg><span class="lbl" data-i18n="a.ticket"></span></button>
    <button data-page="print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg><span class="lbl" data-i18n="a.print"></span></button>
    <button data-page="tickets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 6v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-6z"/><path d="M13 5v2M13 11v2M13 17v2"/></svg><span class="lbl" data-i18n="a.tickets"></span></button>
    <div class="grp" data-i18n="g.manage"></div>
    <button data-page="users"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg><span class="lbl" data-i18n="a.users"></span><span class="bdg" id="userBdg" hidden>0</span></button>
    <button data-page="audit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg><span class="lbl" data-i18n="a.audit"></span></button>
    <div class="grp" data-i18n="g.system"></div>
    <button data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg><span class="lbl" data-i18n="a.settings"></span></button>
  </aside>

  <main class="main">
    <div id="banner"></div>
    <div id="denied" class="banner" style="display:none"><h4 data-i18n="dn.title"></h4><ul><li data-i18n="dn.body"></li></ul></div>

    <div id="console">
    <section class="page on" id="pg-overview">
      <div class="phead"><h2 data-i18n="a.overview"></h2><p data-i18n="d.overview"></p></div>
      <div class="ov">
        <div class="ovc"><div class="n" id="ovWait">0</div><div class="l" data-i18n="s.waiting"></div></div>
        <div class="ovc ac"><div class="n" id="ovServ">0</div><div class="l" data-i18n="s.serving"></div></div>
        <div class="ovc"><div class="n" id="ovIssued">0</div><div class="l" data-i18n="s.issued"></div></div>
        <div class="ovc ok"><div class="n" id="ovOn">0/0</div><div class="l" data-i18n="s.online"></div></div>
        <div class="ovc"><div class="n" id="ovPrint">0</div><div class="l" data-i18n="s.printq"></div></div>
        <div class="ovc bd" id="ovPendCard"><div class="n" id="ovPend">0</div><div class="l" data-i18n="s.pending"></div></div>
      </div>
      <div class="card"><div class="row"><span class="dot" id="npDot"></span><span id="ovNow" class="muted"></span></div></div>
      <div class="ql">
        <button data-goto="session"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span><b data-i18n="a.session"></b><small data-i18n="ql.session"></small></span></button>
        <button data-goto="announce"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></span><span><b data-i18n="a.announce"></b><small data-i18n="ql.announce"></small></span></button>
        <button data-goto="tickets"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 6v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-6z"/></svg></span><span><b data-i18n="a.tickets"></b><small data-i18n="ql.tickets"></small></span></button>
        <button data-goto="users" id="qlUsers"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></span><span><b data-i18n="a.users"></b><small data-i18n="ql.users"></small></span></button>
      </div>
    </section>

    <section class="page" id="pg-session">
      <div class="phead"><h2 data-i18n="a.session"></h2><p data-i18n="d.session"></p></div>
      <div class="card">
        <div class="g">
          <div><label data-i18n="se.prefix"></label><input id="prefixInput" placeholder="A" style="text-transform:uppercase"></div>
          <div><label data-i18n="se.avg"></label><input id="avgMinutes" type="number" min="1" value="3"></div>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn" id="btnSetPrefix" data-i18n="se.setPrefix"></button>
          <button class="btn warn" id="btnAdvance" data-i18n="se.advance"></button>
        </div>
        <p class="muted" style="margin-top:10px" data-i18n="se.avgNote"></p>
      </div>
    </section>

    <section class="page" id="pg-announce">
      <div class="phead"><h2 data-i18n="a.announce"></h2><p data-i18n="d.announce"></p></div>
      <div class="card">
        <h3 data-i18n="an.manual"></h3>
        <div class="g">
          <div><label data-i18n="tk.label"></label><input id="manLabel" data-ph="an.ticketPh" style="text-transform:uppercase"></div>
          <div><label data-i18n="tk.counter"></label><select id="manCounter"></select></div>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn warn" id="btnManPlay" data-i18n="an.play"></button>
          <button class="btn gray" id="btnStopCur" data-i18n="an.stopCur"></button>
          <button class="btn bad solid" id="btnStopAll" data-i18n="an.stopAll"></button>
        </div>
        <p class="muted" style="margin-top:10px" id="nowPlaying"></p>
      </div>
      <div class="card">
        <h3 data-i18n="an.languages"></h3>
        <div class="row">
          <label class="check"><input type="checkbox" id="langEn"><span data-i18n="an.en"></span></label>
          <label class="check"><input type="checkbox" id="langYue"><span data-i18n="an.yue"></span></label>
          <label class="check"><input type="checkbox" id="langZh"><span data-i18n="an.zh"></span></label>
        </div>
        <div class="g" style="margin-top:12px;max-width:220px"><div><label data-i18n="an.repeat"></label><input id="ttsRepeat" type="number" min="1" max="5" value="1"></div></div>
        <p class="muted" style="margin-top:8px" data-i18n="an.ttsNote"></p>
        <div class="row" style="margin-top:12px">
          <button class="btn" id="btnTtsSave" data-i18n="c.save"></button>
          <button class="btn warn" id="btnTest" data-i18n="an.test"></button>
        </div>
      </div>
    </section>

    <section class="page" id="pg-counters">
      <div class="phead"><h2 data-i18n="a.counters"></h2><p data-i18n="d.counters"></p></div>
      <div class="card">
        <div class="g">
          <div><label data-i18n="co.name"></label><input id="newCounterName" placeholder="Counter 1"></div>
          <div><label data-i18n="co.nameZh"></label><input id="newCounterZh" placeholder="一號櫃位"></div>
        </div>
        <div class="row" style="margin-top:10px"><button class="btn" id="btnAddCounter" data-i18n="co.add"></button></div>
        <div class="scroll" style="margin-top:14px"><table><tbody id="counterList"></tbody></table></div>
      </div>
    </section>

    <section class="page" id="pg-texts">
      <div class="phead"><h2 data-i18n="a.texts"></h2><p data-i18n="d.texts"></p></div>
      <div class="card">
        <div class="g"><div><label data-i18n="tx.title"></label><input id="setTitle"></div><div><label data-i18n="tx.subtitle"></label><input id="setSubtitle"></div></div>
        <div style="margin-top:12px"><label data-i18n="tx.note"></label><input id="setNote"></div>
        <hr>
        <h3 data-i18n="tx.paper"></h3>
        <div class="row">
          <label class="check"><input type="radio" name="paper" id="paper80" value="80"><span>80mm</span></label>
          <label class="check"><input type="radio" name="paper" id="paper58" value="58"><span>58mm</span></label>
        </div>
        <p class="muted" style="margin-top:8px" data-i18n="tx.paperNote"></p>
        <div class="row" style="margin-top:14px"><button class="btn" id="btnSave" data-i18n="tx.saveAll"></button></div>
      </div>
    </section>

    <section class="page" id="pg-ticket">
      <div class="phead"><h2 data-i18n="a.ticket"></h2><p data-i18n="d.ticket"></p></div>
      <div class="tkd">
        <div>
          <div class="card">
            <h3 data-i18n="td.title"></h3>
            <div class="g">
              <div><label data-i18n="td.titleZh"></label><input id="tkTitleZh" maxlength="20"></div>
              <div><label data-i18n="td.titleEn"></label><input id="tkTitleEn" maxlength="40"></div>
            </div>
          </div>
          <div class="card">
            <h3 data-i18n="td.header"></h3>
            <div class="g">
              <div><label data-i18n="td.schoolZh"></label><input id="tkSchoolZh" maxlength="30"></div>
              <div><label data-i18n="td.schoolEn"></label><input id="tkSchoolEn" maxlength="60"></div>
            </div>
          </div>
          <div class="card">
            <h3 data-i18n="td.sections"></h3>
            <p class="muted" data-i18n="td.sectionsHint"></p>
            <div class="row" style="margin-bottom:10px">
              <button class="btn gray mini" id="tkAllOn" data-i18n="td.allOn"></button>
              <button class="btn gray mini" id="tkAllOff" data-i18n="td.allOff"></button>
            </div>
            <div class="tgrid">
              <label class="trow"><span class="tl"><b data-i18n="td.sLogo"></b></span><span class="tswitch"><input type="checkbox" id="tkShowLogo"><i></i></span></label>
              <label class="trow"><span class="tl"><b data-i18n="td.sSchoolZh"></b></span><span class="tswitch"><input type="checkbox" id="tkShowSchoolZh"><i></i></span></label>
              <label class="trow"><span class="tl"><b data-i18n="td.sSchoolEn"></b></span><span class="tswitch"><input type="checkbox" id="tkShowSchoolEn"><i></i></span></label>
              <label class="trow"><span class="tl"><b data-i18n="td.sTitleZh"></b></span><span class="tswitch"><input type="checkbox" id="tkShowTitleZh"><i></i></span></label>
              <label class="trow"><span class="tl"><b data-i18n="td.sTitleEn"></b></span><span class="tswitch"><input type="checkbox" id="tkShowTitleEn"><i></i></span></label>
              <label class="trow"><span class="tl"><b data-i18n="td.sTime"></b></span><span class="tswitch"><input type="checkbox" id="tkShowTime"><i></i></span></label>
              <label class="trow"><span class="tl"><b data-i18n="td.sReprintTime"></b></span><span class="tswitch"><input type="checkbox" id="tkShowReprintTime"><i></i></span></label>
              <label class="trow"><span class="tl"><b data-i18n="td.sSession"></b></span><span class="tswitch"><input type="checkbox" id="tkShowSession"><i></i></span></label>
              <label class="trow"><span class="tl"><b data-i18n="td.sNote"></b></span><span class="tswitch"><input type="checkbox" id="tkShowNote"><i></i></span></label>
              <label class="trow"><span class="tl"><b data-i18n="td.sBadge"></b></span><span class="tswitch"><input type="checkbox" id="tkShowBadge"><i></i></span></label>
            </div>
          </div>
          <div class="card">
            <h3 data-i18n="td.note"></h3>
            <textarea id="tkNote" rows="6"></textarea>
          </div>
          <div class="row">
            <button class="btn" id="tkSave" data-i18n="td.save"></button>
            <button class="btn gray" id="tkReset" data-i18n="td.reset"></button>
          </div>
        </div>
        <div class="tkd-stage">
          <div class="card">
            <div class="row" style="margin-bottom:12px">
              <h3 style="border:0;padding:0;margin:0" data-i18n="td.preview"></h3>
              <span class="spacer"></span>
              <div class="seg" id="tkMode"><button data-m="normal" class="on" data-i18n="td.normal"></button><button data-m="reprint" data-i18n="td.reprint"></button></div>
            </div>
            <div class="tkd-paperwrap"><div id="tkPreview"></div></div>
          </div>
        </div>
      </div>
    </section>

    <section class="page" id="pg-print">
      <div class="phead"><h2 data-i18n="a.print"></h2><p data-i18n="d.print"></p></div>
      <div class="card">
        <p class="muted" data-i18n="fp.desc"></p>
        <label data-i18n="fp.text"></label><textarea id="freeText" rows="4" data-ph="fp.textPh"></textarea>
        <label style="margin-top:12px" data-i18n="fp.image"></label>
        <div class="row"><input type="file" id="freeImage" accept="image/*" style="flex:1"><button class="btn gray" id="btnClearImg" type="button" data-i18n="fp.clearImg"></button></div>
        <img id="freeImgPreview" style="max-width:180px;margin-top:8px;display:none;border:1px solid var(--line2);border-radius:8px">
        <div class="row" style="margin-top:12px">
          <label style="margin:0" data-i18n="fp.copies"></label>
          <input type="number" id="freeCopies" min="1" max="10" value="1" style="width:80px">
          <button class="btn warn" id="btnFreePrint" type="button" data-i18n="fp.send"></button>
        </div>
      </div>
      <div class="card">
        <h3 data-i18n="fp.quick"></h3>
        <div class="row">
          <button class="btn gray" id="btnQTest" type="button" data-i18n="fp.qTest"></button>
          <button class="btn gray" id="btnQLast" type="button" data-i18n="fp.qLast"></button>
          <button class="btn gray" id="btnQList" type="button" data-i18n="fp.qList"></button>
        </div>
      </div>
    </section>

    <section class="page" id="pg-tickets">
      <div class="phead"><h2 data-i18n="a.tickets"></h2><p data-i18n="d.tickets"></p></div>
      <div class="card">
        <div class="row" style="margin-bottom:12px">
          <div class="seg" id="tSeg"><button data-f="waiting" class="on" data-i18n="tk.waiting"></button><button data-f="called" data-i18n="tk.called"></button><button data-f="done" data-i18n="tk.done"></button><button data-f="all" data-i18n="c.all"></button></div>
          <span class="spacer"></span><span class="tag" id="tCount"></span>
        </div>
        <div class="scroll" style="max-height:560px"><table><tbody id="tBody"></tbody></table></div>
      </div>
    </section>

    <section class="page" id="pg-users">
      <div class="phead"><h2 data-i18n="a.users"></h2><p data-i18n="d.users"></p></div>
      <div class="card">
        <div class="row" style="margin-bottom:12px">
          <div class="seg" id="uSeg"><button data-f="pending" class="on" data-i18n="u.pending"></button><button data-f="approved" data-i18n="u.approved"></button><button data-f="rejected" data-i18n="u.rejected"></button><button data-f="all" data-i18n="c.all"></button></div>
          <span class="spacer"></span><span class="tag" id="uCount"></span>
        </div>
        <div class="scroll"><table><tbody id="uBody"></tbody></table></div>
        <p class="muted" style="margin-top:12px" data-i18n="u.foot"></p>
      </div>
    </section>

    <section class="page" id="pg-audit">
      <div class="phead"><h2 data-i18n="a.audit"></h2><p data-i18n="d.audit"></p></div>
      <div class="card">
        <div class="row" style="margin-bottom:12px">
          <div class="seg" id="aSeg"><button data-v="live" class="on" data-i18n="ad.live"></button><button data-v="sessions" data-i18n="ad.sessions"></button></div>
          <select id="adKind" style="width:auto;min-width:120px">
            <option value="" data-i18n="c.all"></option><option value="auth">auth</option><option value="db">db</option><option value="ui">ui</option><option value="view">view</option><option value="print">print</option><option value="session">session</option><option value="error">error</option>
          </select>
          <input id="adQ" data-ph="ad.searchPh" style="max-width:220px">
          <span class="spacer"></span><span class="tag" id="adCount"></span>
        </div>
        <div class="scroll" style="max-height:520px" id="adLiveWrap"><table><tbody id="adLiveBody"></tbody></table></div>
        <div class="scroll" style="max-height:520px;display:none" id="adSesWrap"><table><tbody id="adSesBody"></tbody></table></div>
        <div class="row" style="margin-top:12px">
          <div><label data-i18n="ad.from"></label><input type="date" id="adFrom" style="width:auto"></div>
          <button class="btn bad" id="btnAdPurge" data-i18n="ad.purge"></button>
          <button class="btn gray" id="btnAdExport" data-i18n="ad.export"></button>
        </div>
      </div>
    </section>

    <section class="page" id="pg-settings">
      <div class="phead"><h2 data-i18n="a.settings"></h2><p data-i18n="d.settings"></p></div>
      <div class="card">
        <h3 data-i18n="st.account"></h3>
        <div class="g"><div><label data-i18n="c.email"></label><input id="acEmail" disabled></div><div><label data-i18n="c.role"></label><input id="acRole" disabled></div><div><label data-i18n="st.uid"></label><input id="acUid" disabled></div></div>
        <div class="row" style="margin-top:10px"><button class="btn gray" id="backup" data-i18n="st.backup"></button></div>
      </div>
      <div class="card">
        <h3 data-i18n="st.diag"></h3>
        <p class="muted" data-i18n="st.diagD"></p>
        <div class="scroll" style="margin-top:12px"><table><tbody id="diBody"></tbody></table></div>
        <div class="row" style="margin-top:12px"><button class="btn" id="retry" data-i18n="c.retry"></button><button class="btn gray" id="copyDiag" data-i18n="st.copy"></button></div>
        <div class="help" style="margin-top:12px" data-i18n="st.hint"></div>
      </div>
      <div class="card danger">
        <h3 data-i18n="dg.zone"></h3>
        <p class="muted" data-i18n="dg.zoneD"></p>
        <p class="muted" data-i18n="dg.clearTicketsD"></p>
        <div class="row" style="margin-top:12px"><button class="btn bad" id="delTickets" data-i18n="dg.clearTickets"></button><button class="btn bad solid" id="delAll" data-i18n="dg.resetAll"></button></div>
      </div>
    </section>
    </div>
  </main>
</div>

<div class="scrim" id="ueModal"><div class="modal" role="dialog" aria-modal="true">
  <span class="eyebrow" data-i18n="a.users"></span>
