<!doctype html><html lang="zh-Hant-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Printer 列印端</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/lang.css">
</head><body class="auth-locked" data-terminal="printer">
<div class="topbar">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg><span data-i18n="app.printer"></span></div>
  <div class="right"><span class="chip" id="sessChip"></span></div>
</div>
<main class="admin-wrap">
  <div class="card">
    <h3 data-i18n="c.status"></h3>
    <div class="row"><span class="dot" id="dot"></span><b id="statusText" style="font-size:16px" data-i18n="pr.connecting"></b></div>
    <p class="muted" style="margin-top:8px" data-i18n="pr.keepOn"></p>
    <div class="row" style="margin-top:12px">
      <span class="tag" id="paperChip">—</span>
      <span class="tag" id="countChip">—</span>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btnTest" class="btn warn" data-i18n="pr.test"></button>
      <button id="btnClearQueue" class="btn gray" data-i18n="pr.clear"></button>
    </div>
  </div>
  <div class="card">
    <h3 data-i18n="pr.log"></h3>
    <div class="log" id="log"></div>
  </div>
</main>
<div id="printArea"></div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/config.js"></script><script src="js/i18n.js"></script><script src="js/auth.js"></script><script src="js/common.js"></script>
<script src="js/printer.js"></script>
</body></html>
