<!doctype html><html lang="zh-Hant-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counter 櫃位</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/lang.css">
</head><body class="auth-locked" data-terminal="counter">
<div class="topbar">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg><span id="title">Counter</span></div>
  <div class="right"><span class="chip" id="sessChip"></span></div>
</div>
<main class="counter-wrap">
  <div class="card">
    <div class="big-num" id="curNum">—</div>
    <div class="muted" style="text-align:center" id="curInfo"></div>
  </div>
  <div class="btn-grid">
    <button id="btnNext" class="btn">CALL NEXT<span class="hk">呼叫下一位</span></button>
    <button id="btnRecall" class="btn warn">RECALL<span class="hk">重新呼叫</span></button>
    <button id="btnComplete" class="btn ok">COMPLETE<span class="hk">完成</span></button>
    <button id="btnUndo" class="btn gray">UNDO<span class="hk">撤回上一步</span></button>
    <button id="btnStop" class="btn bad solid">STOP<span class="hk">停止播報</span></button>
    <button id="btnPause" class="btn gray">PAUSE<span class="hk">暫停服務</span></button>
    <button id="btnCallNum" class="btn ghost">CALL NUMBER<span class="hk">指定號碼</span></button>
  </div>
  <div class="card" id="keypadCard" style="display:none">
    <div class="keypad" id="keypad"></div>
    <div class="row" style="margin-top:10px">
      <input id="numInput" placeholder="A001" style="max-width:160px">
      <button id="btnGo" class="btn">Call 呼叫</button>
      <button id="btnCloseKeypad" class="btn gray">Close 關閉</button>
    </div>
  </div>
  <div class="card">
    <h3>Waiting 等候中</h3>
    <div class="waiting-list" id="waitList"></div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/config.js"></script><script src="js/i18n.js"></script><script src="js/auth.js"></script><script src="js/common.js"></script>
<script src="js/counter.js"></script>
</body></html>
