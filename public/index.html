<!doctype html><html lang="zh-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Queue System 排隊系統</title><link rel="stylesheet" href="css/style.css">
</head><body>
<div id="ktmcLogin" style="position:fixed; inset:0; background:linear-gradient(180deg,#f8fafc,#eef2f7); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px">
  <div class="card" style="max-width:400px; width:100%; text-align:center">
    <h3 style="border:none; padding:0; font-size:24px; margin-bottom:8px" id="ktmcLoginTitle">🔒 Login Required 需要登入</h3>
    <p style="margin:0 0 4px" id="ktmcLoginDesc">請輸入密碼</p>
    <p class="muted" style="margin:0 0 16px; font-size:13px" id="ktmcLoginDescEn">Enter the password to continue</p>
    <input type="password" id="ktmcLoginPw" placeholder="Password 密碼" style="width:100%; text-align:center; font-size:18px; padding:14px">
    <button id="ktmcLoginBtn" style="width:100%; margin-top:14px; font-size:16px; padding:14px">登入 Login</button>
    <p id="ktmcLoginErr" style="margin-top:12px; color:#dc2626; font-weight:600; min-height:20px"></p>
  </div>
</div>
<div class="topbar"><span>KTMC Queue System 排隊系統</span><span class="chip">Live 即時</span></div>
<div class="admin-wrap">
  <div class="card center" style="text-align:center">
    <h3 style="border:none; padding:0; font-size:24px">Welcome 歡迎使用</h3>
    <p class="muted">Choose a station 選擇終端</p>
  </div>
  <div class="btn-grid">
    <a href="kiosk.html"><button style="width:100%">TAKE TICKET<br><span class="hk">取號機</span></button></a>
    <a href="display.html"><button class="btn-green" style="width:100%">DISPLAY<br><span class="hk">顯示屏</span></button></a>
    <button id="btnCounters" class="btn-amber" style="width:100%">COUNTER<br><span class="hk">櫃位選擇</span></button>
    <a href="admin.html"><button class="btn-gray" style="width:100%">ADMIN<br><span class="hk">管理</span></button></a>
  </div>
  <div class="card" id="counterPick" style="display:none">
    <h3>Choose Counter 選擇櫃位</h3>
    <div class="btn-grid" id="counterList"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/common.js"></script>
<script>
/* 啟動操作密碼驗證 Enable operation password check */
bindLoginForm(false);
if (!KTMC_USER_AUTHED) { window.onAfterLogin = () => location.reload(); }

onState(s => {
  const cs = (s.settings.counters || []);
  document.getElementById('counterList').innerHTML = cs.map(c =>
    `<a href="counter.html?id=${c.id}"><button class="btn-amber" style="width:100%">${c.name}<br><span class="hk">${c.nameZh}</span></button></a>`
  ).join('') || '<p class="muted">No counters 暫無櫃位</p>';
});

document.getElementById('btnCounters').onclick = () => {
  const el = document.getElementById('counterPick');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
};
</script>
</body></html>
