<!doctype html><html lang="zh-Hant-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Display 顯示屏</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/lang.css">
</head><body class="auth-locked" data-terminal="display">
<div class="topbar stage">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span id="dpTitle"></span></div>
  <span class="ticker" id="ticker"></span>
  <div class="right"><span class="chip" id="sessChip"></span></div>
</div>
<main class="display-wrap">
  <div class="card call-grid" id="callGrid"></div>
  <div class="card queue-panel">
    <h2>Waiting 等候中</h2>
    <div class="queue-items" id="queueItems"></div>
  </div>
</main>
<button id="startTts">START SOUND 開啟廣播聲音</button>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/config.js"></script><script src="js/i18n.js"></script><script src="js/auth.js"></script><script src="js/common.js"></script>
<script src="js/tts.js"></script><script src="js/display.js"></script>
</body></html>
